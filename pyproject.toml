[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninecoder"
version = "0.1.0"
description = "A lightweight self-built coding agent for local software tasks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NineCoder" }]
dependencies = []

[project.scripts]
ninecoder = "ninecoder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
